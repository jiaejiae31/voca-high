          {curriculums.length === 0 ? (
            <div className="p-8 text-center space-y-3 bg-white dark:bg-[#1D2A1F] rounded-3xl border">
              <div className="text-4xl">📂</div>
              <p className="text-xs text-stone-500 font-bold">생성된 커리큘럼이 없습니다.</p>
              <button
                onClick={() => onTabChange('create_curr')}
                className="py-2.5 px-4 bg-[#2D5A27] text-white text-xs font-bold rounded-xl"
              >
                첫 커리큘럼 만들기 🌱
              </button>
            </div>
          ) : (
            <div className="space-y-3">
              {curriculums.map((curr) => {
                const isActive = curr.id === activeCurriculumId;
                return (
                  <div
                    key={curr.id}
                    className={`p-4 rounded-3xl border-2 transition-all space-y-3 ${
                      isActive
                        ? 'border-[#2D5A27] bg-[#FAF6EC] dark:bg-[#203624] dark:border-[#A1C954] shadow-md'
                        : 'border-stone-200 dark:border-stone-800 bg-white dark:bg-[#1D2A1F]'
                    }`}
                  >
                    <div className="flex items-start justify-between">
                      <div>
                        <div className="flex items-center gap-2">
                          <h3 className="font-extrabold text-sm text-[#2C3E2D] dark:text-[#EDECE4]">
                            {curr.title}
                          </h3>
                          {isActive && (
                            <span className="px-2 py-0.5 rounded-full bg-[#2D5A27] text-white text-[10px] font-black">
                              현재 활성
                            </span>
                          )}
                        </div>
                        <div className="text-xs text-stone-500 dark:text-stone-400 mt-1">
                          📚 {curr.bookTitle} • 하루 {curr.dailyGoal}단어
                        </div>
                      </div>
                      <button
                        onClick={() => onDelete(curr.id)}
                        className="text-stone-400 hover:text-red-500 p-1 text-sm font-bold"
                        title="커리큘럼 삭제"
                      >
                        🗑️
                      </button>
                    </div>

                    <div className="flex items-center justify-between pt-1 border-t border-stone-100 dark:border-stone-800 text-[11px]">
                      <span className="text-stone-400">
                        기준: {curr.attendanceCriteria?.length || 0}개 완료 시 출석
                      </span>
                      {!isActive ? (
                        <button
                          onClick={() => onSelect(curr.id)}
                          className="px-3 py-1.5 rounded-xl bg-stone-100 dark:bg-stone-800 font-bold hover:bg-[#2D5A27] hover:text-white transition-all text-[#2D5A27] dark:text-[#A1C954]"
                        >
                          이 커리큘럼으로 활성화
                        </button>
                      ) : (
                        <span className="text-[#2D5A27] dark:text-[#A1C954] font-bold">
                          ✓ 학습 진행 중
                        </span>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 11. 학습 단어장 화면 (StudyVocabScreen)
    // ==========================================
    function StudyVocabScreen({ words, onTabChange, onComplete, initialStyle = 'card_flip', initialMode = 'one_by_one' }) {
      const [style, setStyle] = useState(initialStyle);
      const [mode, setMode] = useState(initialMode);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [flippedMap, setFlippedMap] = useState({});

      const currentWord = words[currentIndex] || words[0] || { word: 'Ready', meaning: '준비' };

      const toggleFlip = (id) => {
        setFlippedMap(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handleNext = () => {
        if (currentIndex < words.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          alert("🎉 오늘 배정된 학습 단어장을 모두 확인했습니다! 훈련 단어장으로 이어집니다.");
          onComplete();
        }
      };

      const handlePrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(prev => prev - 1);
        }
      };

      return (
        <div className="p-5 pb-8 space-y-5 animate-fadeIn">
          <div className="flex items-center justify-between">
            <button
              onClick={() => onTabChange('home')}
              className="w-10 h-10 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200 font-black text-base shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center"
            >
              ←
            </button>
            <div className="text-center">
              <h2 className="text-base font-black text-[#2D5A27] dark:text-[#A1C954]">
                📖 학습 단어장 ({currentIndex + 1} / {words.length})
              </h2>
              <span className="text-[10px] text-stone-400 font-bold">
                {style === 'basic' ? '기본 (단어+뜻)' : style === 'card_flip' ? '단어&뜻 보기 (뒤집기)' : '단어만 보기'}
              </span>
            </div>
            <button
              onClick={() => setMode(m => m === 'one_by_one' ? 'list' : 'one_by_one')}
              className="px-2.5 py-1.5 rounded-xl bg-stone-100 dark:bg-stone-800 text-xs font-bold text-stone-600 dark:text-stone-300"
            >
              {mode === 'one_by_one' ? '📋 리스트' : '🗂️ 하나씩'}
            </button>
          </div>

          {mode === 'one_by_one' ? (
            <div className="space-y-5">
              <div className="space-y-1">
                <div className="flex justify-between text-xs font-bold text-stone-400">
                  <span>진행도</span>
                  <span>{currentIndex + 1} / {words.length}</span>
                </div>
                <div className="w-full h-2 bg-stone-200 dark:bg-stone-800 rounded-full overflow-hidden">
                  <div
                    className="h-full bg-[#2D5A27] dark:bg-[#A1C954] transition-all duration-300"
                    style={{ width: `${((currentIndex + 1) / words.length) * 100}%` }}
                  />
                </div>
              </div>

              {style === 'card_flip' ? (
                <div className="grid grid-cols-2 gap-3 min-h-[220px]">
                  <div className="p-5 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 flex flex-col justify-between shadow-md">
                    <div className="flex justify-between items-center text-xs text-stone-400 font-mono">
                      <span>SPELLING</span>
                      <button onClick={() => playTTS(currentWord.word)} className="text-stone-500 hover:scale-110">🔊</button>
                    </div>
                    <div className="my-auto text-center">
                      <div className="font-black text-2xl text-[#2C3E2D] dark:text-[#EDECE4] tracking-wide break-words">
                        {currentWord.word}
                      </div>
                    </div>
                    <div className="text-[10px] text-stone-400 text-center font-bold">스펠링 확인</div>
                  </div>

                  <div
                    onClick={() => toggleFlip(currentWord.id)}
                    className={`p-5 rounded-3xl cursor-pointer transition-all duration-300 flex flex-col justify-between shadow-md select-none border ${
                      flippedMap[currentWord.id]
                        ? 'bg-[#FAF6EC] dark:bg-[#203624] border-[#2D5A27] dark:border-[#A1C954] animate-flipIn'
                        : 'bg-stone-100 dark:bg-stone-800 border-dashed border-stone-300 dark:border-stone-700 hover:bg-stone-200'
                    }`}
                  >
                    <div className="flex justify-between items-center text-xs font-bold text-stone-400">
                      <span>MEANING</span>
                      <span>{flippedMap[currentWord.id] ? '🔓 확인됨' : '🔒 터치'}</span>
                    </div>

                    <div className="my-auto text-center">
                      {flippedMap[currentWord.id] ? (
                        <div className="font-black text-xl text-[#2D5A27] dark:text-[#A1C954] leading-relaxed break-words">
                          {currentWord.meaning}
                        </div>
                      ) : (
                        <div className="space-y-1">
                          <div className="text-2xl">🃏</div>
                          <div className="font-bold text-xs text-stone-400">탭하여 뜻 확인</div>
                        </div>
                      )}
                    </div>

                    <div className="text-[10px] text-stone-400 text-center font-bold">
                      {flippedMap[currentWord.id] ? '다시 탭하면 숨김' : '클릭 시 뒤집힘'}
                    </div>
                  </div>
                </div>
              ) : style === 'word_only' ? (
                <div className="p-8 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-center space-y-4 shadow-md min-h-[220px] flex flex-col justify-center">
                  <div className="flex justify-center items-center gap-2">
                    <span className="font-black text-3xl text-[#2C3E2D] dark:text-[#EDECE4] tracking-wide">
                      {currentWord.word}
                    </span>
                    <button onClick={() => playTTS(currentWord.word)} className="text-xl text-stone-400">🔊</button>
                  </div>
                  <p className="text-xs text-stone-400 font-medium">
                    머릿속으로 뜻을 떠올려보세요 (단어만 보기 모드)
                  </p>
                </div>
              ) : (
                <div className="p-6 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-4 shadow-md min-h-[220px]">
                  <div className="flex justify-between items-start">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-black text-2xl text-[#2C3E2D] dark:text-[#EDECE4]">
                          {currentWord.word}
                        </span>
                        <button onClick={() => playTTS(currentWord.word)} className="text-stone-400 text-lg">🔊</button>
                      </div>
                    </div>
                    <span className="px-2.5 py-1 rounded-full bg-[#E8F5E9] dark:bg-[#1f3723] text-[#2D5A27] dark:text-[#A1C954] text-xs font-bold">
                      {currentWord.part_of_speech || '기타'}
                    </span>
                  </div>

                  <div className="p-4 rounded-2xl bg-[#FAF6EC] dark:bg-[#162418] border border-[#EADBCA] dark:border-[#203022]">
                    <div className="font-black text-base text-[#2D5A27] dark:text-[#A1C954]">
                      {currentWord.meaning}
                    </div>
                  </div>
                </div>
              )}

              <div className="flex gap-2">
                <button
                  onClick={handlePrev}
                  disabled={currentIndex === 0}
                  className="w-1/3 py-4 bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 font-extrabold text-xs rounded-2xl disabled:opacity-40"
                >
                  ◀ 이전
                </button>
                <button
                  onClick={handleNext}
                  className="w-2/3 py-4 bg-[#2D5A27] text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-95 transition-all"
                >
                  {currentIndex === words.length - 1 ? '🎉 학습 완료하고 훈련으로' : '다음 단어 ▶'}
                </button>
              </div>
            </div>
          ) : (
            <div className="space-y-4">
              <div className="space-y-2 max-h-[65vh] overflow-y-auto pr-1">
                {words.map((item, idx) => (
                  <div
                    key={item.id || idx}
                    className="p-3.5 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 flex items-center justify-between shadow-sm"
                  >
                    <div className="flex items-center gap-3">
                      <span className="text-xs font-mono font-bold text-stone-400 w-5">{idx + 1}</span>
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span className="font-black text-sm">{item.word}</span>
                          <button onClick={() => playTTS(item.word)} className="text-stone-400 text-xs">🔊</button>
                        </div>
                        {style !== 'word_only' && (
                          <div className="text-xs font-bold text-[#2D5A27] dark:text-[#A1C954]">
                            {item.meaning}
                          </div>
                        )}
                      </div>
                    </div>

                    {style === 'card_flip' && (
                      <button
                        onClick={() => toggleFlip(item.id)}
                        className="px-2.5 py-1 rounded-xl bg-stone-100 dark:bg-stone-800 text-[10px] font-bold"
                      >
                        {flippedMap[item.id] ? '가리기' : '뜻보기'}
                      </button>
                    )}
                  </div>
                ))}
              </div>

              <button
                onClick={onComplete}
                className="w-full py-4 bg-[#2D5A27] text-white font-extrabold text-sm rounded-2xl shadow-lg"
              >
                🎉 리스트 학습 완료하고 훈련으로 이어하기
              </button>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // 12. 훈련 단어장 화면 (TrainingScreen)
    // - format === 'one_by_one' (하나씩) & format === 'list' (리스트로 한 번에 전체 풀기) 완벽 지원!
    // ==========================================
    function TrainingScreen({
      words,
      onTabChange,
      onComplete,
      config = { trainingType: 'recall', direction: 'en_to_ko', format: 'one_by_one', timerSec: 10 },
      onRewardSunlight
    }) {
      const { trainingType, direction, format, timerSec } = config;
      
      // 단어 하나씩 모드 상태
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [timeLeft, setTimeLeft] = useState(timerSec);
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [spellingInput, setSpellingInput] = useState('');
      const [isFlipped, setIsFlipped] = useState(false);
      const [isAnswered, setIsAnswered] = useState(false);

      // 리스트 모드 상태
      const [listAnswers, setListAnswers] = useState({}); // { [wordId]: selectedText or spellingText }
      const [listFlipped, setListFlipped] = useState({}); // { [wordId]: boolean }
      const [isListSubmitted, setIsListSubmitted] = useState(false);
      const [listScore, setListScore] = useState(0);

      const currentWord = words[currentIndex] || words[0] || { word: 'apple', meaning: '사과' };

      // 문제 보기 4개 생성 도우미
      const getChoicesForWord = useCallback((w) => {
        const isEnToKo = direction === 'en_to_ko';
        const correctText = isEnToKo ? w.meaning : w.word;
        const distractors = words.filter(item => item.id !== w.id);
        const shuffled = [...distractors].sort(() => 0.5 - Math.random()).slice(0, 3);
        const list = [
          { text: correctText, isCorrect: true },
          ...shuffled.map(s => ({ text: isEnToKo ? s.meaning : s.word, isCorrect: false }))
        ];
        return list.sort(() => 0.5 - Math.random());
      }, [words, direction]);

      // 단일 문제용 choices
      const choices = useMemo(() => {
        return getChoicesForWord(currentWord);
      }, [currentWord, getChoicesForWord]);

      // 리스트 문제용 전체 choices 맵
      const listChoicesMap = useMemo(() => {
        const map = {};
        words.forEach(w => {
          map[w.id] = getChoicesForWord(w);
        });
        return map;
      }, [words, getChoicesForWord]);

      // 타이머 (하나씩 풀기 전용)
      useEffect(() => {
        if (format === 'list' || timerSec <= 0 || isAnswered) return;
        setTimeLeft(timerSec);
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              setIsAnswered(true);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [currentIndex, isAnswered, timerSec, format]);

      const handleChoiceSelect = (choice) => {
        if (isAnswered) return;
        setSelectedChoice(choice);
        setIsAnswered(true);
        if (choice.isCorrect) {
          setScore(s => s + 1);
          onRewardSunlight();
        }
      };

      const handleSpellingSubmit = (e) => {
        e.preventDefault();
        if (isAnswered) return;
        setIsAnswered(true);
        const isCorrect = spellingInput.trim().toLowerCase() === currentWord.word.toLowerCase();
        if (isCorrect) {
          setScore(s => s + 1);
          onRewardSunlight();
        }
      };

      const handleNextQuestion = () => {
        if (currentIndex < words.length - 1) {
          setCurrentIndex(prev => prev + 1);
          setIsAnswered(false);
          setSelectedChoice(null);
          setSpellingInput('');
          setIsFlipped(false);
        } else {
          alert(`🎉 훈련 완료! 정답: ${score + (selectedChoice?.isCorrect ? 1 : 0)} / ${words.length}`);
          onComplete();
        }
      };

      // 리스트 모드: 전체 제출 및 채점
      const handleListSubmit = () => {
        let correctCount = 0;
        words.forEach(w => {
          const userAns = listAnswers[w.id];
          if (!userAns) return;
          if (trainingType === 'recall') {
            const isEnToKo = direction === 'en_to_ko';
            const target = isEnToKo ? w.meaning : w.word;
            if (userAns === target) correctCount++;
          } else if (trainingType === 'spelling') {
            if (userAns.trim().toLowerCase() === w.word.toLowerCase()) correctCount++;
          } else if (trainingType === 'flashcard') {
            if (userAns === 'correct') correctCount++;
          }
        });

        setListScore(correctCount);
        setIsListSubmitted(true);

        // 맞힌 개수만큼 햇살 적립
        for (let i = 0; i < correctCount; i++) {
          onRewardSunlight();
        }

        alert(`🎉 리스트 훈련 채점 완료! 총 ${correctCount} / ${words.length}개 정답 (햇살 +${correctCount}☀️ 획득!)`);
      };

      const questionText = direction === 'en_to_ko' ? currentWord.word : currentWord.meaning;
      const answerText = direction === 'en_to_ko' ? currentWord.meaning : currentWord.word;

      return (
        <div className="p-5 pb-8 space-y-5 animate-fadeIn">
          {/* 상단 헤더 */}
          <div className="flex items-center justify-between">
            <button
              onClick={() => onTabChange('home')}
              className="w-10 h-10 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200 font-black text-base shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center"
            >
              ←
            </button>
            <div className="text-center">
              <h2 className="text-base font-black text-[#5F8D4E] dark:text-[#A1C954]">
                🎯 {trainingType === 'recall' ? '워드 리콜 (4지선다)' : trainingType === 'flashcard' ? '플래시 카드' : '스펠링 훈련'}
              </h2>
              <div className="text-[10px] text-stone-400 font-bold">
                {direction === 'en_to_ko' ? '영➔한' : '한➔영'} • {format === 'list' ? `전체 ${words.length}단어 리스트` : `${currentIndex + 1} / ${words.length}`}
              </div>
            </div>
            {format !== 'list' && timerSec > 0 ? (
              <span className={`px-2.5 py-1 rounded-full font-black text-xs ${timeLeft <= 3 ? 'bg-red-500 text-white animate-ping' : 'bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300'}`}>
                ⏱️ {timeLeft}s
              </span>
            ) : <div className="w-10" />}
          </div>

          {/* ======================================================== */}
          {/* 1. [리스트로 한 번에 풀기 모드 (format === 'list')]      */}
          {/* ======================================================== */}
          {format === 'list' ? (
            <div className="space-y-4">
              <div className="p-3 bg-[#FAF6EC] dark:bg-[#162418] border border-[#A1C954]/50 rounded-2xl text-center text-xs font-bold text-[#2D5A27] dark:text-[#A1C954]">
                📋 전체 {words.length}문제가 한 화면에 나열되어 있습니다. 모두 풀고 아래 [채점 및 제출하기]를 누르세요.
              </div>

              <div className="space-y-4 max-h-[65vh] overflow-y-auto pr-1">
                {words.map((w, qIdx) => {
                  const qWord = direction === 'en_to_ko' ? w.word : w.meaning;
                  const targetAns = direction === 'en_to_ko' ? w.meaning : w.word;
                  const userAns = listAnswers[w.id];

                  return (
                    <div
                      key={w.id || qIdx}
                      className="p-4 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-3 shadow-sm"
                    >
                      <div className="flex items-center justify-between">
                        <span className="font-mono font-black text-xs text-stone-400">
                          Q{qIdx + 1}.
                        </span>
                        <span className="font-black text-base text-[#2C3E2D] dark:text-[#EDECE4]">
                          {qWord}
                        </span>
                        {direction === 'en_to_ko' && (
                          <button onClick={() => playTTS(w.word)} className="text-stone-400 text-xs">🔊</button>
                        )}
                      </div>

                      {/* 워드 리콜 4지선다 리스트 */}
                      {trainingType === 'recall' && (
                        <div className="grid grid-cols-2 gap-2 text-xs">
                          {(listChoicesMap[w.id] || []).map((ch, cIdx) => {
                            let bClass = "bg-stone-50 dark:bg-stone-800 border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200";
                            if (userAns === ch.text) {
                              bClass = "bg-[#2D5A27] text-white font-black shadow";
                            }
                            if (isListSubmitted) {
                              if (ch.isCorrect) bClass = "bg-emerald-500 text-white font-black";
                              else if (userAns === ch.text && !ch.isCorrect) bClass = "bg-rose-500 text-white font-black";
                            }
                            return (
                              <button
                                key={cIdx}
                                disabled={isListSubmitted}
                                onClick={() => setListAnswers(prev => ({ ...prev, [w.id]: ch.text }))}
                                className={`p-2.5 rounded-xl border text-left font-bold transition-all ${bClass}`}
                              >
                                {cIdx + 1}. {ch.text}
                              </button>
                            );
                          })}
                        </div>
                      )}

                      {/* 플래시카드 리스트 */}
                      {trainingType === 'flashcard' && (
                        <div className="space-y-2 text-xs">
                          <button
                            type="button"
                            onClick={() => setListFlipped(prev => ({ ...prev, [w.id]: !prev[w.id] }))}
                            className="w-full py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 border border-dashed text-center font-bold"
                          >
                            {listFlipped[w.id] ? `정답: ${targetAns}` : "🃏 탭하여 정답 확인"}
                          </button>
                          {listFlipped[w.id] && !isListSubmitted && (
                            <div className="grid grid-cols-2 gap-2">
                              <button
                                onClick={() => setListAnswers(prev => ({ ...prev, [w.id]: 'wrong' }))}
                                className={`py-2 rounded-xl font-bold ${userAns === 'wrong' ? 'bg-rose-500 text-white' : 'bg-stone-100 dark:bg-stone-800'}`}
                              >
                                헷갈려요 😅
                              </button>
                              <button
                                onClick={() => setListAnswers(prev => ({ ...prev, [w.id]: 'correct' }))}
                                className={`py-2 rounded-xl font-bold ${userAns === 'correct' ? 'bg-emerald-600 text-white' : 'bg-stone-100 dark:bg-stone-800'}`}
                              >
                                알아요! ✅
                              </button>
                            </div>
                          )}
                        </div>
                      )}

                      {/* 스펠링 타이핑 리스트 */}
                      {trainingType === 'spelling' && (
                        <div className="space-y-1.5">
                          <input
                            type="text"
                            disabled={isListSubmitted}
                            value={listAnswers[w.id] || ''}
                            onChange={(e) => setListAnswers(prev => ({ ...prev, [w.id]: e.target.value }))}
                            placeholder="철자 입력..."
                            className="w-full p-2.5 rounded-xl border bg-stone-50 dark:bg-stone-800 text-xs font-bold focus:outline-none focus:ring-1 focus:ring-[#5F8D4E]"
                          />
                          {isListSubmitted && (
                            <div className="text-[11px] font-bold">
                              {(listAnswers[w.id] || '').trim().toLowerCase() === w.word.toLowerCase()
                                ? <span className="text-emerald-600">✅ 정답입니다!</span>
                                : <span className="text-rose-500">❌ 오답 (정답: {w.word})</span>}
                            </div>
                          )}
                        </div>
                      )}

                    </div>
                  );
                })}
              </div>

              {!isListSubmitted ? (
                <button
                  onClick={handleListSubmit}
                  className="w-full py-4 bg-[#5F8D4E] hover:bg-[#4d743f] text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-95 transition-all"
                >
                  📝 훈련 결과 일괄 채점 및 제출하기 ({Object.keys(listAnswers).length} / {words.length} 풀음)
                </button>
              ) : (
                <button
                  onClick={onComplete}
                  className="w-full py-4 bg-[#2D5A27] text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-95 transition-all"
                >
                  🎉 훈련 완료하고 메인 홈으로 돌아가기 (점수: {listScore}/{words.length})
                </button>
              )}
            </div>
          ) : (
            /* ======================================================== */
            /* 2. [단어 하나씩 풀기 모드 (format === 'one_by_one')]    */
            /* ======================================================== */
            <div className="space-y-4">
              <div className="p-6 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-center space-y-3 shadow-md">
                <span className="text-[10px] font-bold text-[#5F8D4E] dark:text-[#A1C954] uppercase tracking-wider">
                  QUESTION
                </span>
                <div className="text-2xl font-black text-[#2C3E2D] dark:text-[#EDECE4]">
                  {questionText}
                </div>
                {direction === 'en_to_ko' && (
                  <button onClick={() => playTTS(currentWord.word)} className="text-stone-400 text-sm">
                    🔊 발음 듣기
                  </button>
                )}
              </div>

              {trainingType === 'recall' && (
                <div className="space-y-2">
                  {choices.map((c, idx) => {
                    let btnStyle = "bg-white dark:bg-[#1D2A1F] border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200";
                    if (isAnswered) {
                      if (c.isCorrect) {
                        btnStyle = "bg-emerald-500 text-white border-emerald-600 font-black shadow";
                      } else if (selectedChoice === c) {
                        btnStyle = "bg-rose-500 text-white border-rose-600 font-black";
                      }
                    }
                    return (
                      <button
                        key={idx}
                        disabled={isAnswered}
                        onClick={() => handleChoiceSelect(c)}
                        className={`w-full p-4 rounded-2xl border text-left text-xs font-bold transition-all flex items-center justify-between ${btnStyle}`}
                      >
                        <span>{idx + 1}. {c.text}</span>
                        {isAnswered && c.isCorrect && <span>✅</span>}
                      </button>
                    );
                  })}
                </div>
              )}

              {trainingType === 'flashcard' && (
                <div className="space-y-4">
                  <div
                    onClick={() => setIsFlipped(f => !f)}
                    className={`p-8 rounded-3xl border-2 cursor-pointer text-center min-h-[160px] flex flex-col justify-center items-center gap-2 transition-all select-none shadow ${
                      isFlipped
                        ? 'bg-[#FAF6EC] dark:bg-[#203624] border-[#5F8D4E] animate-flipIn'
                        : 'bg-stone-100 dark:bg-stone-800 border-dashed border-stone-300'
                    }`}
                  >
                    <div className="text-xs text-stone-400 font-bold">
                      {isFlipped ? '정답 확인' : '탭하여 카드 뒤집기'}
                    </div>
                    <div className="text-2xl font-black text-[#2D5A27] dark:text-[#A1C954]">
                      {isFlipped ? answerText : '❓'}
                    </div>
                  </div>

                  {isFlipped && !isAnswered && (
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => setIsAnswered(true)}
                        className="py-3 bg-stone-200 dark:bg-stone-800 text-stone-700 dark:text-stone-300 font-bold rounded-2xl text-xs"
                      >
                        아직 헷갈려요 😅
                      </button>
                      <button
                        onClick={() => {
                          setIsAnswered(true);
                          setScore(s => s + 1);
                          onRewardSunlight();
                        }}
                        className="py-3 bg-[#5F8D4E] text-white font-black rounded-2xl text-xs shadow"
                      >
                        완벽히 외웠어요! ☀️+1
                      </button>
                    </div>
                  )}
                </div>
              )}

              {trainingType === 'spelling' && (
                <form onSubmit={handleSpellingSubmit} className="space-y-3">
                  <input
                    type="text"
                    disabled={isAnswered}
                    value={spellingInput}
                    onChange={(e) => setSpellingInput(e.target.value)}
                    placeholder="정확한 철자를 입력하세요..."
                    className="w-full p-4 rounded-2xl border bg-white dark:bg-[#1D2A1F] text-sm font-bold text-center focus:outline-none focus:ring-2 focus:ring-[#5F8D4E]"
                  />

                  {!isAnswered ? (
                    <button
                      type="submit"
                      className="w-full py-4 bg-[#5F8D4E] text-white font-extrabold text-sm rounded-2xl shadow"
                    >
                      제출하기
                    </button>
                  ) : (
                    <div className="p-4 rounded-2xl bg-stone-100 dark:bg-stone-800 text-center text-xs space-y-1">
                      <div className="font-bold">
                        {spellingInput.trim().toLowerCase() === currentWord.word.toLowerCase()
                          ? '🎉 정답입니다!'
                          : `❌ 아쉬워요! 정답은: ${currentWord.word}`}
                      </div>
                    </div>
                  )}
                </form>
              )}

              {isAnswered && (
                <button
                  onClick={handleNextQuestion}
                  className="w-full py-4 bg-[#2D5A27] text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-95 transition-all mt-4"
                >
                  {currentIndex === words.length - 1 ? '🎉 훈련 결과 보기' : '다음 문제 ▶'}
                </button>
              )}
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // 13. 학습 랭킹 (RankingScreen)
    // ==========================================
    function RankingScreen({ onTabChange, treeInfo, currentUser }) {
      const [rankings, setRankings] = useState([]);
      const [loading, setLoading] = useState(true);

      const fetchRankingData = useCallback(async () => {
        setLoading(true);
        try {
          if (supabaseClient) {
            const { data, error } = await supabaseClient
              .from('user_trees')
              .select('user_id, sunlight_count, tree_level, updated_at')
              .order('sunlight_count', { ascending: false })
              .limit(50);

            if (error) throw error;
            if (data && data.length > 0) {
              setRankings(data);
            } else {
              setRankings([{
                user_id: currentUser?.email || '나 (학습자)',
                sunlight_count: treeInfo.sunlight,
                tree_level: treeInfo.currentStage.level
              }]);
            }
          } else {
            setRankings([{
              user_id: currentUser?.email || '나 (학습자)',
              sunlight_count: treeInfo.sunlight,
              tree_level: treeInfo.currentStage.level
            }]);
          }
        } catch (err) {
          console.warn("랭킹 불러오기 대체 폴백:", err);
          setRankings([{
            user_id: currentUser?.email || '나 (학습자)',
            sunlight_count: treeInfo.sunlight,
            tree_level: treeInfo.currentStage.level
          }]);
        } finally {
          setLoading(false);
        }
      }, [currentUser, treeInfo.sunlight, treeInfo.currentStage.level]);

      useEffect(() => {
        fetchRankingData();

        let channel = null;
        if (supabaseClient) {
          try {
            channel = supabaseClient
              .channel('public:user_trees')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'user_trees' }, () => {
                fetchRankingData();
              })
              .subscribe();
          } catch (e) {
            console.error("Realtime 구독 에러:", e);
          }
        }

        return () => {
          if (channel && supabaseClient) {
            supabaseClient.removeChannel(channel);
          }
        };
      }, [fetchRankingData]);

      const myRankIndex = rankings.findIndex(r => r.user_id === currentUser?.email || r.user_id === currentUser?.id);
      const myRank = myRankIndex !== -1 ? myRankIndex + 1 : 1;

      const first = rankings[0] || null;
      const second = rankings[1] || null;
      const third = rankings[2] || null;
      const rest = rankings.slice(3);

      return (
        <div className="p-5 pb-24 space-y-5 animate-fadeIn relative min-h-[90vh]">
          <div className="flex items-center justify-between">
            <button
              onClick={() => onTabChange('home')}
              className="w-10 h-10 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200 font-black text-base shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center"
            >
              ←
            </button>
            <h2 className="text-base font-black text-[#2D5A27] dark:text-[#A1C954]">
              🏆 학습 랭킹 (전체기간)
            </h2>
            <button
              onClick={fetchRankingData}
              title="실시간 순위 새로고침"
              className="px-2.5 py-1.5 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-200 border border-amber-300 dark:border-amber-800 text-xs font-black flex items-center gap-1 active:scale-95 transition-all shadow-sm"
            >
              🔄 새로고침
            </button>
          </div>

          {loading ? (
            <div className="p-12 text-center text-xs font-bold text-stone-400">
              실시간 학습 랭킹 불러오는 중... ⏳
            </div>
          ) : (
            <>
              <div className="pt-4 pb-2">
                <div className="flex items-end justify-center gap-2 max-w-[360px] mx-auto text-center">
                  
                  <div className="flex-1 flex flex-col items-center">
                    <div className="text-xl mb-1">🥈</div>
                    <div className="text-[11px] font-black truncate max-w-[80px]">
                      {second ? (second.user_id?.split('@')[0] || '2등') : '-'}
                    </div>
                    <div className="text-[9px] text-stone-400 font-bold mb-1">
                      {second ? `☀️ ${second.sunlight_count}` : '대기중'}
                    </div>
                    <div className="w-full h-24 bg-gradient-to-t from-slate-300 to-slate-200 dark:from-slate-800 dark:to-slate-700 rounded-t-2xl flex flex-col items-center justify-center shadow">
                      <span className="font-black text-slate-600 dark:text-slate-300 text-lg">2</span>
                      <span className="text-[9px] font-bold text-slate-500">2nd</span>
                    </div>
                  </div>

                  <div className="flex-1 flex flex-col items-center -mt-4">
                    <div className="text-2xl mb-0.5 animate-bounce">👑</div>
                    <div className="text-xs font-black text-[#2D5A27] dark:text-[#A1C954] truncate max-w-[90px]">
                      {first ? (first.user_id?.split('@')[0] || '1등') : '-'}
                    </div>
                    <div className="text-[10px] text-amber-500 font-black mb-1">
                      {first ? `☀️ ${first.sunlight_count}` : '대기중'}
                    </div>
                    <div className="w-full h-32 bg-gradient-to-t from-amber-400 to-yellow-300 dark:from-amber-700 dark:to-yellow-600 rounded-t-2xl flex flex-col items-center justify-center shadow-lg border-t-2 border-yellow-200">
                      <span className="font-black text-amber-900 dark:text-white text-2xl">1</span>
                      <span className="text-[10px] font-black text-amber-800 dark:text-amber-200">CHAMPION</span>
                    </div>
                  </div>

                  <div className="flex-1 flex flex-col items-center">
                    <div className="text-xl mb-1">🥉</div>
                    <div className="text-[11px] font-black truncate max-w-[80px]">
                      {third ? (third.user_id?.split('@')[0] || '3등') : '-'}
                    </div>
                    <div className="text-[9px] text-stone-400 font-bold mb-1">
                      {third ? `☀️ ${third.sunlight_count}` : '대기중'}
                    </div>

    // ==========================================
    // 14. 커스텀 단어장 생성 (CreateCustomBookScreen)
    // ==========================================
    function CreateCustomBookScreen({ onTabChange, onSaveCustomBook, currentUser }) {
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [rows, setRows] = useState([
        { id: 1, word: '', meaning: '', partOfSpeech: '명사' },
        { id: 2, word: '', meaning: '', partOfSpeech: '동사' },
        { id: 3, word: '', meaning: '', partOfSpeech: '형용사' }
      ]);
      const [saving, setSaving] = useState(false);

      const addRow = () => {
        setRows(prev => [
          ...prev,
          { id: Date.now() + Math.random(), word: '', meaning: '', partOfSpeech: '기타' }
        ]);
      };

      const removeRow = (id) => {
        if (rows.length <= 1) return alert("최소 1개 이상의 단어 행이 필요합니다.");
        setRows(prev => prev.filter(r => r.id !== id));
      };

      const updateRow = (id, field, value) => {
        setRows(prev => prev.map(r => r.id === id ? { ...r, [field]: value } : r));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!title.trim()) return alert("단어장 제목을 입력해주세요.");
        
        const validWords = rows.filter(r => r.word.trim() && r.meaning.trim());
        if (validWords.length === 0) {
          return alert("최소 1개 이상의 영단어와 한글 뜻을 입력해주세요.");
        }

        setSaving(true);
        try {
          const newBook = {
            id: 'cb_' + Date.now(),
            user_id: currentUser?.email || 'local_user',
            title: title.trim(),
            description: description.trim(),
            word_count: validWords.length,
            words: validWords.map(w => ({
              id: 'cw_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
              word: w.word.trim(),
              meaning: w.meaning.trim(),
              part_of_speech: w.partOfSpeech,
              stage: 0
            })),
            created_at: new Date().toISOString()
          };

          if (supabaseClient) {
            const { data: bookData, error: bError } = await supabaseClient
              .from('custom_vocab_books')
              .insert([{
                user_id: newBook.user_id,
                title: newBook.title,
                description: newBook.description,
                word_count: newBook.word_count
              }])
              .select();

            if (!bError && bookData && bookData.length > 0) {
              const bookDbId = bookData[0].id;
              const wordsToInsert = newBook.words.map(w => ({
                book_id: bookDbId,
                user_id: newBook.user_id,
                word: w.word,
                meaning: w.meaning,
                part_of_speech: w.part_of_speech
              }));
              await supabaseClient.from('custom_vocab_words').insert(wordsToInsert);
            }
          }

          onSaveCustomBook(newBook);
          alert(`🎉 '${newBook.title}' 단어장(${validWords.length}단어)이 성공적으로 생성되었습니다!`);
          onTabChange('custom_books');
        } catch (err) {
          console.error("Save custom book err:", err);
          alert("단어장 저장 중 오류가 발생했습니다: " + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="p-5 pb-8 space-y-6 animate-fadeIn">
          <div className="flex items-center justify-between">
            <button
              onClick={() => onTabChange('home')}
              className="w-10 h-10 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200 font-black text-base shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center"
            >
              ←
            </button>
            <h2 className="text-base font-black text-[#2D5A27] dark:text-[#A1C954]">
              ➕ 커스텀 단어장 생성
            </h2>
            <div className="w-10" />
          </div>

          <form onSubmit={handleSubmit} className="space-y-5 text-xs">
            
            <div className="p-4 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-3 shadow-sm">
              <div className="space-y-1">
                <label className="font-bold text-stone-700 dark:text-stone-300">단어장 제목 *</label>
                <input
                  type="text"
                  required
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="예: 2학기 내신 기출 핵심 어휘집"
                  className="w-full p-3 rounded-2xl border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-800 font-bold focus:outline-none focus:ring-2 focus:ring-[#2D5A27]"
                />
              </div>

              <div className="space-y-1">
                <label className="font-bold text-stone-700 dark:text-stone-300">설명 (선택)</label>
                <input
                  type="text"
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  placeholder="예: 교과서 5~8과 꼭 외울 단어들"
                  className="w-full p-3 rounded-2xl border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-800 text-stone-500 font-medium focus:outline-none"
                />
              </div>
            </div>

            <div className="space-y-2">
              <div className="flex items-center justify-between px-1">
                <label className="font-bold text-stone-700 dark:text-stone-300">
                  단어 리스트 작성 ({rows.length}개)
                </label>
                <button
                  type="button"
                  onClick={addRow}
                  className="px-3 py-1.5 rounded-xl bg-[#2D5A27] text-white font-black text-xs shadow-sm hover:bg-[#20421c] active:scale-95 transition-all flex items-center gap-1"
                >
                  <span>+ 단어 행 추가</span>
                </button>
              </div>

              <div className="space-y-2.5 max-h-[50vh] overflow-y-auto pr-1">
                {rows.map((row, idx) => (
                  <div
                    key={row.id}
                    className="p-3.5 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-2 shadow-sm relative group"
                  >
                    <div className="flex items-center justify-between text-[11px] font-mono text-stone-400">
                      <span>단어 #{idx + 1}</span>
                      <button
                        type="button"
                        onClick={() => removeRow(row.id)}
                        className="text-stone-400 hover:text-red-500 text-xs font-bold"
                        title="행 삭제"
                      >
                        ✕ 삭제
                      </button>
                    </div>

                    <div className="grid grid-cols-12 gap-2">
                      <input
                        type="text"
                        required
                        value={row.word}
                        onChange={(e) => updateRow(row.id, 'word', e.target.value)}
                        placeholder="영단어 (예: vibrant)"
                        className="col-span-6 p-2.5 rounded-xl border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-800 font-bold focus:outline-none focus:ring-1 focus:ring-[#2D5A27]"
                      />
                      <input
                        type="text"
                        required
                        value={row.meaning}
                        onChange={(e) => updateRow(row.id, 'meaning', e.target.value)}
                        placeholder="한글 뜻 (예: 생생한, 활기찬)"
                        className="col-span-6 p-2.5 rounded-xl border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-800 font-bold focus:outline-none focus:ring-1 focus:ring-[#2D5A27]"
                      />
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <button
              type="submit"
              disabled={saving}
              className="w-full py-4 bg-[#2D5A27] hover:bg-[#22471f] text-white font-extrabold text-sm rounded-2xl shadow-xl active:scale-95 transition-all flex items-center justify-center gap-2"
            >
              {saving ? <span>저장 중... ⏳</span> : <span>💾 전체 단어장 저장하기</span>}
            </button>

          </form>
        </div>
      );
    }

    // ==========================================
    // 15. 나의 커스텀 단어장 목록 (CustomBooksScreen)

                <div

    // ==========================================
    // 16. 기능 튜토리얼 (TutorialScreen)
    // ==========================================
    function TutorialScreen({ onTabChange }) {
      const [step, setStep] = useState(0);

      const steps = [
        {
          title: "1. 나만의 커리큘럼 생성",
          icon: "🎯",
          desc: "교육부 3000 단어 또는 중학/고교 교재를 선택하고, 하루 목표량(예: 20단어)과 출석 인정 기준 체크박스를 자유롭게 설정하세요.",
          tip: "사이드바 메뉴 > '커리큘럼 생성'에서 언제든 새로운 학습 과정을 추가할 수 있습니다."
        },
        {
          title: "2. 학습 단어장 3대 암기 모드",
          icon: "📖",
          desc: "1) 종합 기본 모드, 2) 오른쪽 카드가 뒤집히며 뜻이 나타나는 플립 토글 모드, 3) 스펠링에 집중하는 단어만 보기 모드를 자유롭게 선택하세요.",
          tip: "원하는 보기 방식(단어 하나씩 보기 / 리스트로 보기)도 선택할 수 있습니다."

          icon: "🎯",
          desc: "워드 리콜(4지선다 인출 퀴즈), 플래시 카드(뒤집기 자가점검), 스펠링 훈련(키보드 타이핑)을 통해 장기기억으로 고정시킵니다.",
          tip: "문제당 5초/10초/무제한 타이머와 영➔한, 한➔영 출제 방향, 하나씩/리스트 모드를 설정할 수 있습니다."
        },
        {
          title: "4. 에빙하우스 상시 복습칸",
          icon: "🧠",
          desc: "메인 화면 상단에 상시 배치된 복습칸은 1일, 7일, 30일 주기에 맞춰 망각 직전인 단어들을 자동으로 모아 배정해 줍니다.",
          tip: "복습 단어가 0개여도 상태 메시지가 항상 표시되어 오늘의 학습 완료를 유도합니다."
        },
        {

          icon: "🌳",
          desc: "단어를 학습하거나 훈련에서 정답을 맞힐 때마다 무조건 햇살 1개(☀️ +1)가 적립되며, 7단계 지혜나무로 성장합니다.",
          tip: "씨앗(0) ➔ 새싹(100) ➔ 어린 줄기(300) ➔ 푸른 묘목(500) ➔ 보카 나무(1000) ➔ 황금 지혜나무(2000) ➔ 불멸의 세계수(5000)"
        }
      ];

      const current = steps[step];

      return (
        <div className="p-5 pb-8 space-y-6 animate-fadeIn">
          <div className="flex items-center justify-between">
            <button
              onClick={() => onTabChange('home')}
              className="w-10 h-10 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200 font-black text-base shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center"
            >
              ←
            </button>
            <h2 className="text-base font-black text-[#2D5A27] dark:text-[#A1C954]">
              💡 기능 튜토리얼 가이드

            <div className="w-10" />

          </div>

          <div className="p-6 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-4 shadow-lg min-h-[300px] flex flex-col justify-between">
            <div className="space-y-3">
              <div className="flex items-center justify-between">
                <span className="text-3xl">{current.icon}</span>

                  {step + 1} / {steps.length}

              onClick={() => setStep(s => Math.max(0, s - 1))}

              {step === steps.length - 1 ? '🎉 가이드 완료 (홈으로)' : '다음 단계 ▶'}
            </button>
          </div>
        </div>
      );

    // ==========================================

    function EbbinghausScreen({ onTabChange }) {

            <div className="w-10" />

            <h3 className="font-black text-sm text-[#2D5A27] dark:text-[#A1C954] flex items-center gap-1.5">
              <span>🔬</span> 에빙하우스(Hermann Ebbinghaus)의 1885년 연구
            </h3>
            <p className="text-stone-600 dark:text-stone-300 font-medium">
              인간의 뇌는 새로운 단어를 학습한 직후부터 급격히 망각을 시작합니다. 
              <strong>학습 20분 후 42%가 사라지고, 단 하루(24시간) 만에 67% 이상을 망각</strong>합니다.
            </p>
          </div>

          <div className="p-5 rounded-3xl bg-[#FAF6EC] dark:bg-[#162418] border border-[#A1C954]/50 space-y-4 shadow-sm">
            <div className="flex items-center justify-between">
              <span className="text-xs font-black text-[#2C3E2D] dark:text-[#EDECE4]">
                📊 복습 여부에 따른 기억 유지율 비교
              </span>
              <span className="text-[10px] text-stone-400 font-bold">기억 유지율(%)</span>
            </div>

            <div className="space-y-3 text-xs">
              <div className="space-y-1">
                <div className="flex justify-between text-[11px] font-bold">
                  <span>1일차 (24시간 경과 시)</span>
                  <span className="text-rose-500">복습 없음: 33% / 보카하이: 100% 🟢</span>
                </div>
                <div className="grid grid-cols-2 gap-2 h-3 rounded-full overflow-hidden bg-stone-200 dark:bg-stone-800">
                  <div className="bg-rose-400 rounded-full h-full" style={{ width: '33%' }} />
                  <div className="bg-[#2D5A27] dark:bg-[#A1C954] rounded-full h-full" style={{ width: '100%' }} />
                </div>
              </div>

              <div className="space-y-1">
                <div className="flex justify-between text-[11px] font-bold">
                  <span>7일차 (1주일 경과 시)</span>
                  <span className="text-rose-500">복습 없음: 25% / 보카하이: 95% 🟢</span>
                </div>
                <div className="grid grid-cols-2 gap-2 h-3 rounded-full overflow-hidden bg-stone-200 dark:bg-stone-800">
                  <div className="bg-rose-400 rounded-full h-full" style={{ width: '25%' }} />
                  <div className="bg-[#2D5A27] dark:bg-[#A1C954] rounded-full h-full" style={{ width: '95%' }} />
                </div>
              </div>

              <div className="space-y-1">
                <div className="flex justify-between text-[11px] font-bold">
                  <span>30일차 (1달 경과 시)</span>
                  <span className="text-rose-500">복습 없음: 21% / 보카하이: 98% 영구기억 🌟</span>
                </div>
                <div className="grid grid-cols-2 gap-2 h-3 rounded-full overflow-hidden bg-stone-200 dark:bg-stone-800">
                  <div className="bg-rose-400 rounded-full h-full" style={{ width: '21%' }} />
                  <div className="bg-[#2D5A27] dark:bg-[#A1C954] rounded-full h-full" style={{ width: '98%' }} />
                </div>
              </div>
            </div>

            <p className="text-[11px] text-stone-500 dark:text-stone-400 leading-relaxed font-medium pt-1">
              보카하이는 단어가 장기기억으로 굳어지도록 <strong>1일차, 7일차, 30일차</strong>의 결정적인 복습 타이밍에 자동으로 상시 복습칸을 열어줍니다.
            </p>
          </div>

          <div className="p-4 rounded-3xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900 text-xs space-y-2 text-amber-900 dark:text-amber-200">
            <div className="font-bold flex items-center gap-1.5">
              <span>⚠️</span> 2일 미복습 누적 경고 시스템
            </div>
            <p className="text-[11px] leading-relaxed">
              복습 기한이 도래한 단어를 2일 이상 방치하면 급격한 망각이 발생하므로 복습칸에 경고 알림이 활성화됩니다. 매일 5분씩 복습칸을 비워보세요!
            </p>
          </div>

          <button
            onClick={() => onTabChange('home')}
            className="w-full py-4 bg-[#2D5A27] text-white font-extrabold text-xs rounded-2xl shadow"
          >
            확인하고 홈으로 돌아가기
          </button>
        </div>
      );
    }

    // ==========================================
    // 18. 보카 트리 화면 (TreeScreen)
    // ==========================================
    function TreeScreen({ treeInfo, onTabChange }) {
      const nextStage = TREE_STAGES.find(s => s.level === treeInfo.currentStage.level + 1);
      const reqSun = nextStage ? nextStage.minSunlight : treeInfo.currentStage.maxSunlight;
      const progressPercent = nextStage 
        ? Math.min(100, Math.round((treeInfo.sunlight / reqSun) * 100))
        : 100;

      return (
        <div className="p-5 pb-8 space-y-6 animate-fadeIn">
          <div className="flex items-center justify-between">
            <button
              onClick={() => onTabChange('home')}
              className="w-10 h-10 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200 font-black text-base shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center"
            >
              ←
            </button>
            <h2 className="text-base font-black text-[#2D5A27] dark:text-[#A1C954]">
              🌳 보카 트리 (Voca Tree)
            </h2>
            <div className="w-10" />
          </div>

          <div className="p-8 rounded-3xl bg-gradient-to-b from-[#FAF6EC] to-[#E8F5E9] dark:from-[#162418] dark:to-[#1e3822] text-center space-y-4 border border-[#A1C954]/50 shadow-md">
            <div className="text-7xl animate-bounce">{treeInfo.currentStage.emoji}</div>
            <div>
              <div className="font-black text-xl text-[#2D5A27] dark:text-[#A1C954]">
                Lv.{treeInfo.currentStage.level} {treeInfo.currentStage.name}
              </div>
              <div className="text-xs text-stone-500 dark:text-stone-400 mt-1">
                "{treeInfo.currentStage.desc}"
              </div>
            </div>

            <div className="space-y-1.5 pt-2">
              <div className="flex justify-between text-xs font-bold text-stone-500">
                <span>햇살: ☀️ {treeInfo.sunlight}</span>
                <span>다음 목표: {reqSun}개 ({progressPercent}%)</span>
              </div>
              <div className="w-full h-3 bg-white dark:bg-black/40 rounded-full overflow-hidden shadow-inner">
                <div
                  className="h-full bg-gradient-to-r from-[#A1C954] to-[#2D5A27] rounded-full transition-all duration-500"
                  style={{ width: `${progressPercent}%` }}
                />
              </div>
            </div>
          </div>

          <div className="p-4 rounded-3xl bg-white dark:bg-[#1D2A1F] border text-xs space-y-1 text-stone-600 dark:text-stone-300">
            <div className="font-bold text-[#2D5A27] dark:text-[#A1C954]">☀️ 햇살 획득 법칙</div>
            <p>• 단어 1개 학습 또는 훈련 정답 = 무조건 햇살 1개 (☀️ +1)</p>
            <p>• 매일매일 꾸준히 학습하면 황금 지혜나무와 불멸의 세계수로 진화합니다!</p>
          </div>
        </div>
      );
    }

    // ==========================================
    // 19. 전체 단어 리스트 (WordListScreen)
    // ==========================================
    function WordListScreen({ onTabChange, allWords }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [displayLimit, setDisplayLimit] = useState(50);

      const filteredWords = useMemo(() => {
        if (!searchQuery.trim()) return allWords;
        const q = searchQuery.toLowerCase().trim();
        return allWords.filter(item => 
          item.word.toLowerCase().includes(q) || (item.meaning && item.meaning.includes(q))
        );
      }, [allWords, searchQuery]);

      return (
        <div className="p-5 pb-8 space-y-5 animate-fadeIn">
          <div className="flex items-center justify-between">
            <button
              onClick={() => onTabChange('home')}
              className="w-10 h-10 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200 font-black text-base shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center"
            >
              ←
            </button>
            <h2 className="text-base font-black text-[#2D5A27] dark:text-[#A1C954]">
              📖 전체 단어 리스트 ({allWords.length})
            </h2>
            <div className="w-10" />
          </div>

          <input
            type="text"
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            placeholder="영단어 또는 한글 뜻 검색..."
            className="w-full p-3.5 rounded-2xl border bg-white dark:bg-[#1D2A1F] text-xs font-bold focus:outline-none focus:ring-2 focus:ring-[#2D5A27]"
          />

          <div className="space-y-2.5 max-h-[65vh] overflow-y-auto pr-1">
            {filteredWords.slice(0, displayLimit).map((item, idx) => (
              <div key={item.id || idx} className="p-4 rounded-2xl bg-white dark:bg-[#1D2A1F] border flex items-center justify-between shadow-sm">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono font-bold text-stone-400">#{idx + 1}</span>
                    <span className="font-black text-sm">{item.word}</span>
                    <button onClick={() => playTTS(item.word)} className="text-stone-400 text-xs">🔊</button>
                  </div>
                  <div className="text-xs font-bold text-[#2D5A27] dark:text-[#A1C954]">{item.meaning}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // 20. 최상위 App 컴포넌트
    // ==========================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [currentTab, setCurrentTab] = useState('home');
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [theme, setTheme] = useState('light');
      const [floatingSun, setFloatingSun] = useState(false);

      const [isStudySetupOpen, setIsStudySetupOpen] = useState(false);
      const [studyInitialStyle, setStudyInitialStyle] = useState('card_flip');
      const [studyInitialMode, setStudyInitialMode] = useState('one_by_one');

      const [isTrainingSetupOpen, setIsTrainingSetupOpen] = useState(false);
      const [trainingConfig, setTrainingConfig] = useState({
        trainingType: 'recall',
        direction: 'en_to_ko',
        format: 'one_by_one',
        timerSec: 10
      });

      // 118개 이상의 단어를 기본으로 제공
      const [allWords, setAllWords] = useState(INITIAL_EMBEDDED_WORDS);
      const [customBooks, setCustomBooks] = useState([]);
      const [curriculums, setCurriculums] = useState([]);
      const [activeCurriculumId, setActiveCurriculumId] = useState(null);

      const [sunlight, setSunlight] = useState(0);

      const [dailyProgress, setDailyProgress] = useState({
        studyCompleted: false,
        flashcardCompleted: false,
        recallCompleted: false,
        spellingCompleted: false,
        isAttendanceStamped: false
      });

      const [dueWords, setDueWords] = useState([]);

      useEffect(() => {
        const savedUser = localStorage.getItem(STORAGE_PREFIX + 'CURRENT_USER');
        if (savedUser) {
          try {
            setCurrentUser(JSON.parse(savedUser));
          } catch (e) {}
        }
      }, []);

      useEffect(() => {
        if (!currentUser) return;
        const uid = currentUser.id || 'default';
        
        const savedCurr = localStorage.getItem(STORAGE_PREFIX + uid + '_CURRICULUMS');
        if (savedCurr) {
          try {
            const parsed = JSON.parse(savedCurr);
            setCurriculums(parsed);
            const activeId = localStorage.getItem(STORAGE_PREFIX + uid + '_ACTIVE_CURR');
            setActiveCurriculumId(activeId || (parsed[0]?.id || null));
          } catch (e) {}
        }

        const savedBooks = localStorage.getItem(STORAGE_PREFIX + uid + '_CUSTOM_BOOKS');
        if (savedBooks) {
          try {
            setCustomBooks(JSON.parse(savedBooks));
          } catch (e) {}
        }

        const savedSun = localStorage.getItem(STORAGE_PREFIX + uid + '_SUNLIGHT');
        if (savedSun !== null && savedSun !== undefined) {
          setSunlight(Number(savedSun) || 0);
        } else {
          setSunlight(0);
        }

        const savedLearned = localStorage.getItem(STORAGE_PREFIX + uid + '_LEARNED_WORD_IDS');
        if (savedLearned) {
          try {
            setLearnedWordIds(JSON.parse(savedLearned));
          } catch (e) {
            setLearnedWordIds([]);
          }
        } else {
          setLearnedWordIds([]);
        }
      }, [currentUser]);

      const [learnedWordIds, setLearnedWordIds] = useState([]);

      const handleMarkWordsLearned = useCallback((wordList) => {
        if (!wordList || wordList.length === 0) return;
        setLearnedWordIds(prev => {
          const set = new Set(prev);
          wordList.forEach(w => {
            const id = (w && w.id !== undefined && w.id !== null) ? w.id : (w && w.word);
            if (id) set.add(id);
          });
          const updated = Array.from(set);
          if (currentUser) {
            const uid = currentUser.id || 'default';
            localStorage.setItem(STORAGE_PREFIX + uid + '_LEARNED_WORD_IDS', JSON.stringify(updated));
          }
          return updated;
        });
      }, [currentUser]);

      const handleRewardSunlight = useCallback(() => {
        setSunlight(prev => {
          const next = prev + 1;
          if (currentUser) {
            const uid = currentUser.id || 'default';
            localStorage.setItem(STORAGE_PREFIX + uid + '_SUNLIGHT', next);
            if (supabaseClient) {
              const currentLvl = TREE_STAGES.reduce((acc, stage) => next >= stage.minSunlight ? stage.level : acc, 1);
              supabaseClient
                .from('user_trees')
                .upsert({
                  user_id: currentUser.email || 'user',
                  sunlight_count: next,
                  tree_level: currentLvl,
                  updated_at: new Date().toISOString()
                }, { onConflict: 'user_id' })
                .then(({ error }) => {
                  if (error) console.error("Supabase user_trees upsert 에러:", error);
                });
            }
          }
          return next;
        });
        setFloatingSun(true);
        setTimeout(() => setFloatingSun(false), 1200);
      }, [currentUser]);

      const currentStage = useMemo(() => {
        for (let i = TREE_STAGES.length - 1; i >= 0; i--) {
          if (sunlight >= TREE_STAGES[i].minSunlight) {
            return TREE_STAGES[i];
          }
        }
        return TREE_STAGES[0];
      }, [sunlight]);

      const activeCurriculum = useMemo(() => {
        return curriculums.find(c => c.id === activeCurriculumId) || curriculums[0] || null;
      }, [curriculums, activeCurriculumId]);

      const handleCreateCurriculum = (newCurr) => {
        const uid = currentUser?.id || 'default';
        const updated = [...curriculums, newCurr];
        setCurriculums(updated);
        setActiveCurriculumId(newCurr.id);
        localStorage.setItem(STORAGE_PREFIX + uid + '_CURRICULUMS', JSON.stringify(updated));
        localStorage.setItem(STORAGE_PREFIX + uid + '_ACTIVE_CURR', newCurr.id);
        
        if (supabaseClient && currentUser) {
          supabaseClient.from('user_curriculums').insert([{
            user_id: currentUser.email || 'user',
            title: newCurr.title,
            book_id: newCurr.bookId,
            daily_goal: newCurr.dailyGoal,
            study_days: newCurr.studyDays,
            attendance_criteria: newCurr.attendanceCriteria
          }]).then();
        }

        alert("🎉 새로운 커리큘럼이 등록되었습니다!");
        setCurrentTab('home');
      };

      const handleSelectCurriculum = (id) => {
        const uid = currentUser?.id || 'default';
        setActiveCurriculumId(id);
        localStorage.setItem(STORAGE_PREFIX + uid + '_ACTIVE_CURR', id);
      };

      const handleDeleteCurriculum = (id) => {
        if (!confirm("정말 이 커리큘럼을 삭제하시겠습니까?")) return;
        const uid = currentUser?.id || 'default';
        const updated = curriculums.filter(c => c.id !== id);
        setCurriculums(updated);
        localStorage.setItem(STORAGE_PREFIX + uid + '_CURRICULUMS', JSON.stringify(updated));
        if (activeCurriculumId === id) {
          const nextId = updated[0]?.id || null;
          setActiveCurriculumId(nextId);
          if (nextId) localStorage.setItem(STORAGE_PREFIX + uid + '_ACTIVE_CURR', nextId);
        }
      };

      const handleSaveCustomBook = (newBook) => {
        const uid = currentUser?.id || 'default';
        const updated = [...customBooks, newBook];
        setCustomBooks(updated);
        localStorage.setItem(STORAGE_PREFIX + uid + '_CUSTOM_BOOKS', JSON.stringify(updated));
      };

      const handleDeleteCustomBook = (bookId) => {
        if (!confirm("단어장을 삭제하시겠습니까?")) return;
        const uid = currentUser?.id || 'default';
        const updated = customBooks.filter(b => b.id !== bookId);
        setCustomBooks(updated);
        localStorage.setItem(STORAGE_PREFIX + uid + '_CUSTOM_BOOKS', JSON.stringify(updated));
      };

      const handleStartCustomStudy = (book) => {
        if (!book.words || book.words.length === 0) return alert("단어장에 수록된 단어가 없습니다.");
        setAllWords(book.words);
        setIsStudySetupOpen(true);
      };

      const handleLogout = () => {
        if (!confirm("로그아웃 하시겠습니까?")) return;
        localStorage.removeItem(STORAGE_PREFIX + 'CURRENT_USER');
        setCurrentUser(null);
        setCurrentTab('home');
        setIsDrawerOpen(false);
      };

      if (!currentUser) {
        return (
          <div className={theme === 'dark' ? 'dark' : ''}>
            <div className="min-h-screen bg-[#FAF6EC] dark:bg-[#121B13] flex justify-center selection:bg-[#A1C954]">
              <div className="w-full max-w-[430px] min-h-screen">
                <AuthScreen onLoginSuccess={(u) => setCurrentUser(u)} />
              </div>
            </div>
          </div>
        );
      }

      // 오늘 공부할 단어: 커리큘럼의 목표량만큼 정확하게 슬라이스
      const targetCount = activeCurriculum?.dailyGoal || 20;
      // 교재별 단어 필터링, 부족하면 전체 풀에서 채워서 언제나 targetCount만큼 정확히 제공
      let bookWords = allWords.filter(w => !activeCurriculum?.bookId || w.bookId === activeCurriculum.bookId || w.bookId === 'voca_3000');
      if (bookWords.length < targetCount) {
        bookWords = allWords;
      }
      const todayWords = bookWords.slice(0, targetCount);

      return (
        <div className={theme === 'dark' ? 'dark' : ''}>
          <div className="min-h-screen bg-stone-200 dark:bg-[#0c130d] text-stone-800 dark:text-stone-100 flex justify-center selection:bg-[#A1C954] selection:text-[#121B13]">
            
            <div className="w-full max-w-[430px] min-h-screen bg-[#FAF6EC] dark:bg-[#121B13] border-x border-[#E5DEC9] dark:border-[#2A3A2C] flex flex-col relative shadow-2xl">
              
              {floatingSun && (
                <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-[#A1C954] text-[#121B13] font-black text-xs rounded-full shadow-2xl animate-bounce">
                  ☀️ +1 햇살 획득!
                </div>
              )}

              <main className="flex-1">
                {currentTab === 'home' && (
                  <HomeScreen
                    currentUser={currentUser}
                    curriculums={curriculums}
                    activeCurriculum={activeCurriculum}
                    onSelectCurriculum={handleSelectCurriculum}
                    treeInfo={{ sunlight, currentStage }}
                    todayWords={todayWords}
                    dueWords={dueWords}
                    dailyProgress={dailyProgress}
                    onTabChange={setCurrentTab}
                    onOpenDrawer={() => setIsDrawerOpen(true)}
                    onOpenModal={() => alert("Supabase 클라우드 실시간 동기화 활성화됨")}
                    onRequestStudySetup={() => setIsStudySetupOpen(true)}
                    onRequestTrainingSetup={() => setIsTrainingSetupOpen(true)}
                  />
                )}

                {currentTab === 'stats' && (
                  <StatsScreen
                    onTabChange={setCurrentTab}
                    treeInfo={{ sunlight, currentStage }}
                    memorizedCount={learnedWordIds.length}
                    dueWords={dueWords}
                    dailyProgress={dailyProgress}
                    curriculums={curriculums}
                  />
                )}

                {currentTab === 'create_curr' && (
                  <CreateCurriculumScreen
                    onTabChange={setCurrentTab}
                    onCreateCurriculum={handleCreateCurriculum}
                  />
                )}

                {currentTab === 'my_curr' && (
                  <MyCurriculumsScreen
                    curriculums={curriculums}
                    activeCurriculumId={activeCurriculumId}
                    onSelect={handleSelectCurriculum}
                    onDelete={handleDeleteCurriculum}
                    onTabChange={setCurrentTab}
                  />
                )}

                {currentTab === 'study_vocab' && (
                  <StudyVocabScreen
                    words={todayWords}
                    onTabChange={setCurrentTab}
                    initialStyle={studyInitialStyle}
                    initialMode={studyInitialMode}
                    onComplete={() => {
                      setDailyProgress(p => ({ ...p, studyCompleted: true }));
                      handleMarkWordsLearned(todayWords);
                      handleRewardSunlight();
                      setIsTrainingSetupOpen(true);
                    }}
                  />
                )}

                {currentTab === 'training' && (
                  <TrainingScreen
                    words={todayWords}
                    config={trainingConfig}
                    onTabChange={setCurrentTab}
                    onRewardSunlight={handleRewardSunlight}
                    onComplete={() => {
                      setDailyProgress(p => ({
                        ...p,
                        recallCompleted: true,
                        isAttendanceStamped: true
                      }));
                      handleMarkWordsLearned(todayWords);
                      setCurrentTab('home');
                    }}
                  />
                )}

                {currentTab === 'ranking' && (
                  <RankingScreen
                    onTabChange={setCurrentTab}
                    treeInfo={{ sunlight, currentStage }}
                    currentUser={currentUser}
                  />
                )}

                {currentTab === 'create_custom_book' && (
                  <CreateCustomBookScreen
                    onTabChange={setCurrentTab}
                    onSaveCustomBook={handleSaveCustomBook}
                    currentUser={currentUser}
                  />
                )}

                {currentTab === 'custom_books' && (
                  <CustomBooksScreen
                    customBooks={customBooks}
                    onTabChange={setCurrentTab}
                    onDeleteBook={handleDeleteCustomBook}
                    onStartCustomStudy={handleStartCustomStudy}
                  />
                )}

                {currentTab === 'tutorial' && (
                  <TutorialScreen onTabChange={setCurrentTab} />
                )}

                {currentTab === 'ebbinghaus' && (
                  <EbbinghausScreen onTabChange={setCurrentTab} />
                )}

                {currentTab === 'tree' && (
                  <TreeScreen
                    treeInfo={{ sunlight, currentStage }}
                    onTabChange={setCurrentTab}
                  />
                )}

                {currentTab === 'word_list' && (
                  <WordListScreen
                    onTabChange={setCurrentTab}
                    allWords={allWords}
                  />
                )}
              </main>

              <AppDrawer
                isOpen={isDrawerOpen}
                onClose={() => setIsDrawerOpen(false)}
                onNavigate={(tab) => {
                  if (tab === 'study_vocab') {
                    setIsStudySetupOpen(true);
                  } else {
                    setCurrentTab(tab);
                  }
                }}
                currentTab={currentTab}
                onLogout={handleLogout}
                currentUser={currentUser}
              />

              <StudySetupModal
                isOpen={isStudySetupOpen}
                onClose={() => setIsStudySetupOpen(false)}
                onStart={(style, mode) => {
                  setStudyInitialStyle(style);
                  setStudyInitialMode(mode);
                  setCurrentTab('study_vocab');
                }}
              />

              <TrainingSetupModal
                isOpen={isTrainingSetupOpen}
                onClose={() => setIsTrainingSetupOpen(false)}
                onStart={(conf) => {
                  setTrainingConfig(conf);
                  setCurrentTab('training');
                }}
              />

            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
