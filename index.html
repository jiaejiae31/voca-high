    // ==========================================
    // 4. 회원가입 및 로그인 화면 (AuthScreen)
    // ==========================================
    function AuthScreen({ onLoginSuccess }) {
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [loading, setLoading] = useState(false);
      const [errMsg, setErrMsg] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrMsg('');
        setLoading(true);

        try {
          if (!email || !password) throw new Error("이메일과 비밀번호를 입력해주세요.");

          if (supabaseClient) {
            if (isSignUp) {
              const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                  data: { display_name: name || email.split('@')[0] }
                }
              });
              if (error) {
                if (error.message.includes("rate limit")) {
                  throw new Error("⚠️ Supabase 이메일 요청 한도 초과: 잠시 후 다시 시도하거나 기존 계정으로 로그인해주세요.");
                }
                throw error;
              }
              alert("🎉 회원가입 성공! 로그인되었습니다.");
              onLoginSuccess(data.user || { id: 'user_' + Date.now(), email, name });
            } else {
              const { data, error } = await supabaseClient.auth.signInWithPassword({
                email,
                password
              });
              if (error) throw error;
              onLoginSuccess(data.user);
            }
          } else {
            const localUser = {
              id: 'local_' + btoa(email).substring(0, 10),
              email,
              name: name || email.split('@')[0]
            };
            localStorage.setItem(STORAGE_PREFIX + 'CURRENT_USER', JSON.stringify(localUser));
            onLoginSuccess(localUser);
          }
        } catch (err) {
          setErrMsg(err.message || "인증 오류가 발생했습니다.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-sm bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 rounded-3xl p-7 shadow-2xl space-y-6 animate-scaleUp">
            
            <div className="text-center space-y-2">
              <div className="w-16 h-16 rounded-3xl bg-[#2D5A27] text-white flex items-center justify-center text-3xl mx-auto shadow-lg animate-bounce">
                🌱
              </div>
              <h2 className="text-2xl font-black text-[#2D5A27] dark:text-[#A1C954] tracking-tight">
                vocahigh
              </h2>
              <p className="text-xs text-stone-500 dark:text-stone-400">
                교육부 3,000 단어 장기기억 & 에빙하우스 망각곡선 복습 시스템
              </p>
            </div>

            <div className="grid grid-cols-2 p-1 bg-stone-100 dark:bg-stone-800 rounded-2xl text-xs font-bold">
              <button
                type="button"
                onClick={() => { setIsSignUp(false); setErrMsg(''); }}
                className={`py-2 rounded-xl transition-all ${!isSignUp ? 'bg-white dark:bg-[#203624] text-[#2D5A27] dark:text-[#A1C954] shadow-sm' : 'text-stone-400'}`}
              >
                로그인
              </button>
              <button
                type="button"
                onClick={() => { setIsSignUp(true); setErrMsg(''); }}
                className={`py-2 rounded-xl transition-all ${isSignUp ? 'bg-white dark:bg-[#203624] text-[#2D5A27] dark:text-[#A1C954] shadow-sm' : 'text-stone-400'}`}
              >
                회원가입
              </button>
            </div>

            {errMsg && (
              <div className="p-3 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-900 rounded-2xl text-red-600 dark:text-red-300 text-xs font-bold leading-relaxed animate-shake">
                {errMsg}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              {isSignUp && (
                <div className="space-y-1.5">
                  <label className="block font-bold text-stone-700 dark:text-stone-300">이름 또는 닉네임</label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="예: 단어열공러"
                    className="w-full p-3.5 rounded-2xl border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-800 font-medium focus:outline-none focus:ring-2 focus:ring-[#2D5A27]"
                  />
                </div>
              )}

              <div className="space-y-1.5">
                <label className="block font-bold text-stone-700 dark:text-stone-300">이메일 계정</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="예: user@gmail.com"
                  className="w-full p-3.5 rounded-2xl border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-800 font-medium focus:outline-none focus:ring-2 focus:ring-[#2D5A27]"
                />
              </div>

              <div className="space-y-1.5">
                <label className="block font-bold text-stone-700 dark:text-stone-300">비밀번호</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="6자 이상 비밀번호"
                  className="w-full p-3.5 rounded-2xl border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-800 font-medium focus:outline-none focus:ring-2 focus:ring-[#2D5A27]"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-4 bg-[#2D5A27] hover:bg-[#22471f] text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2"
              >
                {loading ? (
                  <span>보안 인증 진행 중... ⏳</span>
                ) : (
                  <span>{isSignUp ? '🌱 회원가입하고 보카트리 심기' : '🚀 보카하이 로그인'}</span>
                )}
              </button>
            </form>
          </div>
        </div>
      );
    }

                  매일 맞춤형 단어 학습과 보카트리가 시작됩니다 🌱
                </p>
              </div>
              <button
                onClick={() => onTabChange('create_curr')}
                className="w-full py-4 bg-[#2D5A27] hover:bg-[#22471f] text-white font-black text-sm rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2"
              >
                <span>➕ 나만의 커리큘럼 생성하기</span>
              </button>
            </div>
          ) : (
            <>
              {/* 상시 복습칸 */}
              <div className="p-5 rounded-3xl bg-[#FAF6EC] dark:bg-[#162418] border border-[#A1C954]/40 space-y-3 shadow-sm">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🧠</span>
                    <div>
                      <h3 className="font-extrabold text-xs text-[#2C3E2D] dark:text-[#EDECE4]">
                        에빙하우스 망각곡선 복습칸
                      </h3>
                      <div className="text-[10px] text-stone-500 dark:text-stone-400">
                        {dueWords.length > 0
                          ? `기억이 사라지기 직전인 ${dueWords.length}단어가 대기 중입니다`
                          : "현재 복습 대기 중인 단어가 없습니다 🌿"}
                      </div>
                    </div>
                  </div>
                  <span className={`text-xs px-2.5 py-1 rounded-full font-black ${dueWords.length > 0 ? 'bg-amber-500 text-white animate-pulse' : 'bg-stone-200 dark:bg-stone-800 text-stone-500'}`}>
                    대기 {dueWords.length}단어
                  </span>
                </div>

                {dueWords.length > 0 ? (
                  <button
                    onClick={() => onTabChange('review_mode')}
                    className="w-full py-3 bg-[#5F8D4E] hover:bg-[#4d743f] text-white font-extrabold text-xs rounded-2xl shadow active:scale-95 transition-all flex items-center justify-center gap-2"
                  >
                    <span>🔄 에빙하우스 망각곡선 복습 시작하기 ({dueWords.length}개)</span>
                  </button>
                ) : (
                  <div className="p-3 rounded-2xl bg-white/60 dark:bg-black/20 text-center text-xs text-stone-500 font-medium">
                    오늘 학습을 마치면 1일·7일·30일 주기에 맞춰 복습칸에 자동으로 배정됩니다.
                  </div>
                )}
              </div>

              {/* 오늘의 출석 도장 위젯 */}
              <div className="p-5 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-4 shadow-sm">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📅</span>
                    <div>
                      <h3 className="font-black text-sm text-[#2C3E2D] dark:text-[#EDECE4]">
                        오늘의 출석 도장
                      </h3>
                      <p className="text-[11px] text-stone-400">
                        설정된 출석 인정 기준을 달성하면 도장이 찍힙니다
                      </p>
                    </div>
                  </div>
                  <div>
                    {dailyProgress.isAttendanceStamped ? (
                      <span className="px-3 py-1 bg-emerald-500 text-white font-black text-xs rounded-full shadow-sm animate-scaleUp flex items-center gap-1">
                        <span>출석 완료</span> <span>💮</span>
                      </span>
                    ) : (
                      <span className="px-3 py-1 bg-stone-100 dark:bg-stone-800 text-stone-500 font-bold text-xs rounded-full">
                        미완료 ⏳
                      </span>
                    )}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2 text-xs">
                  {[
                    { id: 'vocab_study', label: '학습 단어장', done: dailyProgress.studyCompleted },
                    { id: 'flashcard', label: '플래시카드', done: dailyProgress.flashcardCompleted },
                    { id: 'recall', label: '훈련 단어장', done: dailyProgress.recallCompleted },
                    { id: 'spelling', label: '스펠링 훈련', done: dailyProgress.spellingCompleted }
                  ].map(item => {
                    const isCriterion = activeCurriculum?.attendanceCriteria?.includes(item.id);
                    return (
                      <div
                        key={item.id}
                        className={`p-2.5 rounded-2xl flex items-center justify-between border ${
                          item.done
                            ? 'bg-[#E8F5E9] dark:bg-[#1b3820] border-[#A1C954]/50 text-[#2D5A27] dark:text-[#A1C954]'
                            : isCriterion
                            ? 'bg-stone-50 dark:bg-stone-800/50 border-stone-200 dark:border-stone-700 text-stone-600 dark:text-stone-300'
                            : 'bg-stone-50 dark:bg-stone-900 border-transparent text-stone-400 opacity-60'
                        }`}
                      >
                        <span className="font-bold flex items-center gap-1">
                          {isCriterion && <span className="text-[9px] px-1 py-0.5 rounded bg-[#2D5A27] text-white">필수</span>}
                          {item.label}
                        </span>
                        <span>{item.done ? '✅' : '○'}</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* 현재 선택된 교재 & 학습 시작 큰 버튼 2개 */}
              <div className="space-y-2">
                <div className="p-4 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="text-3xl">{activeBook.icon}</span>
                    <div>
                      <div className="font-extrabold text-sm text-[#2C3E2D] dark:text-[#EDECE4]">{activeBook.title}</div>
                      <div className="text-xs text-stone-400">
                        목표: 하루 {activeCurriculum?.dailyGoal || 20}단어 배정 (현재 {todayWords.length}단어 준비됨)
                      </div>
                    </div>
                  </div>
                  <span className="text-xs px-2.5 py-1 rounded-full bg-[#FAF6EC] dark:bg-stone-800 font-bold text-[#2D5A27] dark:text-[#A1C954]">
                    {activeBook.levelBadge}
                  </span>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button
                    onClick={onRequestStudySetup}
                    className="py-4 bg-[#2D5A27] hover:bg-[#22471f] text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-98 transition-all flex flex-col items-center justify-center gap-1"
                  >
                    <div className="flex items-center gap-1">
                      <span>📖 학습 단어장</span>
                    </div>
                    <span className="text-[10px] text-emerald-200 font-normal">기본·뜻가림·단어만</span>
                  </button>

                  <button
                    onClick={onRequestTrainingSetup}
                    className="py-4 bg-[#5F8D4E] hover:bg-[#4d743f] text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-98 transition-all flex flex-col items-center justify-center gap-1"
                  >
                    <div className="flex items-center gap-1">
                      <span>🎯 훈련 단어장</span>
                      <span className="text-[10px] px-1.5 py-0.2 bg-white/20 rounded-full">☀️+1</span>
                    </div>
                    <span className="text-[10px] text-lime-200 font-normal">플래시·리콜·스펠링</span>
                  </button>
                </div>
              </div>
            </>
          )}

        </div>
      );
    }

    // ==========================================
    // 6. [신규 복구] 학습 현황 화면 (StatsScreen)
    // ==========================================
    function StatsScreen({ onTabChange, treeInfo, memorizedCount = 0, dueWords = [], dailyProgress, curriculums = [] }) {
      return (
        <div className="p-5 pb-8 space-y-6 animate-fadeIn">
          <div className="flex items-center justify-between">
            <button
              onClick={() => onTabChange('home')}
              className="w-10 h-10 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200 font-black text-base shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center"
            >
              ←
            </button>
            <h2 className="text-base font-black text-[#2D5A27] dark:text-[#A1C954]">
              📊 나의 학습 현황
            </h2>
            <div className="w-10" />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div className="p-4 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-1 shadow-sm">
              <div className="text-xs text-stone-400 font-bold">외운 총 단어</div>
              <div className="text-2xl font-black text-[#2D5A27] dark:text-[#A1C954]">
                {memorizedCount}단어
              </div>
            </div>
            <div className="p-4 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-1 shadow-sm">
              <div className="text-xs text-stone-400 font-bold">누적 모은 햇살</div>
              <div className="text-2xl font-black text-amber-500">
                ☀️ {treeInfo.sunlight}
              </div>
            </div>
            <div className="p-4 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-1 shadow-sm">
              <div className="text-xs text-stone-400 font-bold">오늘 복습 대기</div>
              <div className="text-2xl font-black text-purple-600">
                {dueWords.length}단어
              </div>
            </div>
            <div className="p-4 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-1 shadow-sm">
              <div className="text-xs text-stone-400 font-bold">오늘 출석 상태</div>
              <div className="text-base font-black text-emerald-600">
                {dailyProgress.isAttendanceStamped ? '출석 완료 💮' : '진행 중 ⏳'}
              </div>
            </div>
          </div>

          <div className="p-5 rounded-3xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 space-y-3 shadow-sm text-xs">
            <h3 className="font-black text-sm text-[#2D5A27] dark:text-[#A1C954]">
              🌱 나무 성장 현황
            </h3>
            <div className="flex items-center justify-between p-3 rounded-2xl bg-stone-50 dark:bg-stone-800">
              <span className="font-bold">현재 단계</span>
              <span className="font-black text-[#2D5A27] dark:text-[#A1C954]">
                Lv.{treeInfo.currentStage.level} {treeInfo.currentStage.name} {treeInfo.currentStage.emoji}
              </span>
            </div>
            <div className="flex items-center justify-between p-3 rounded-2xl bg-stone-50 dark:bg-stone-800">
              <span className="font-bold">등록된 커리큘럼</span>
              <span className="font-bold text-stone-600 dark:text-stone-300">
                총 {curriculums.length}개 과정
              </span>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. [팝업] 학습 단어장 3종 암기 모드 선택 모달
    // ==========================================
    function StudySetupModal({ isOpen, onClose, onStart }) {
      const [studyStyle, setStudyStyle] = useState('card_flip');
      const [viewMode, setViewMode] = useState('one_by_one');

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div className="w-full max-w-sm bg-white dark:bg-[#1D2A1F] rounded-3xl p-6 shadow-2xl space-y-5 animate-scaleUp">
            <div className="flex justify-between items-center pb-2 border-b border-stone-100 dark:border-stone-800">
              <div className="flex items-center gap-2">
                <span className="text-xl">📖</span>
                <h3 className="font-black text-base text-[#2D5A27] dark:text-[#A1C954]">
                  학습 단어장 맞춤 옵션
                </h3>
              </div>
              <button onClick={onClose} className="w-7 h-7 rounded-full bg-stone-100 dark:bg-stone-800 font-bold text-xs text-stone-500">✕</button>
            </div>

            <div className="space-y-4 text-xs">
              
              <div className="space-y-2">
                <label className="font-bold text-stone-700 dark:text-stone-300">1. 암기 스타일 선택</label>
                
                <div
                  onClick={() => setStudyStyle('basic')}
                  className={`p-3 rounded-2xl border-2 cursor-pointer transition-all flex items-center justify-between ${
                    studyStyle === 'basic'
                      ? 'border-[#2D5A27] bg-[#FAF6EC] dark:bg-[#203624] dark:border-[#A1C954] shadow-sm'
                      : 'border-stone-200 dark:border-stone-800'
                  }`}
                >
                  <div className="space-y-0.5">
                    <div className="font-black text-xs text-[#2C3E2D] dark:text-[#EDECE4]">
                      📘 기본 (단어 + 뜻 함께 보기)
                    </div>
                    <div className="text-[10px] text-stone-400">영어 스펠링과 뜻, 예문이 함께 보이는 종합 학습</div>
                  </div>
                  <span className={`text-xs ${studyStyle === 'basic' ? 'text-[#2D5A27] font-black' : 'text-stone-300'}`}>✓</span>
                </div>

                <div
                  onClick={() => setStudyStyle('card_flip')}
                  className={`p-3 rounded-2xl border-2 cursor-pointer transition-all flex items-center justify-between ${
                    studyStyle === 'card_flip'
                      ? 'border-[#2D5A27] bg-[#FAF6EC] dark:bg-[#203624] dark:border-[#A1C954] shadow-sm'
                      : 'border-stone-200 dark:border-stone-800'
                  }`}
                >
                  <div className="space-y-0.5">
                    <div className="font-black text-xs text-[#2C3E2D] dark:text-[#EDECE4]">
                      🃏 단어&뜻 보기 (뜻 가림 카드 뒤집기)
                    </div>
                    <div className="text-[10px] text-stone-400">왼쪽 스펠링 카드, 오른쪽은 클릭 시 뒤집히며 뜻 확인</div>
                  </div>
                  <span className={`text-xs ${studyStyle === 'card_flip' ? 'text-[#2D5A27] font-black' : 'text-stone-300'}`}>✓</span>
                </div>

                <div
                  onClick={() => setStudyStyle('word_only')}
                  className={`p-3 rounded-2xl border-2 cursor-pointer transition-all flex items-center justify-between ${
                    studyStyle === 'word_only'
                      ? 'border-[#2D5A27] bg-[#FAF6EC] dark:bg-[#203624] dark:border-[#A1C954] shadow-sm'
                      : 'border-stone-200 dark:border-stone-800'
                  }`}
                >
                  <div className="space-y-0.5">
                    <div className="font-black text-xs text-[#2C3E2D] dark:text-[#EDECE4]">
                      🔤 단어만 보기 (스펠링 집중)
                    </div>
                    <div className="text-[10px] text-stone-400">뜻 없이 영어 단어만 보며 머릿속으로 뜻 연상 훈련</div>
                  </div>
                  <span className={`text-xs ${studyStyle === 'word_only' ? 'text-[#2D5A27] font-black' : 'text-stone-300'}`}>✓</span>
                </div>
              </div>

              <div className="space-y-1.5">
                <label className="font-bold text-stone-700 dark:text-stone-300">2. 보기 방식</label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setViewMode('one_by_one')}
                    className={`py-2.5 rounded-xl font-bold transition-all ${
                      viewMode === 'one_by_one' ? 'bg-[#2D5A27] text-white shadow-md' : 'bg-stone-100 dark:bg-stone-800 text-stone-500'
                    }`}
                  >
                    🗂️ 하나씩 보기
                  </button>
                  <button
                    type="button"
                    onClick={() => setViewMode('list')}
                    className={`py-2.5 rounded-xl font-bold transition-all ${
                      viewMode === 'list' ? 'bg-[#2D5A27] text-white shadow-md' : 'bg-stone-100 dark:bg-stone-800 text-stone-500'
                    }`}
                  >
                    📋 리스트로 보기
                  </button>
                </div>
              </div>

            </div>

            <button
              onClick={() => {
                onClose();
                onStart(studyStyle, viewMode);
              }}
              className="w-full py-4 bg-[#2D5A27] text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-95 transition-all"
            >
              🚀 선택한 모드로 학습 시작하기
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. [팝업] 훈련 단어장 3대 훈련 모드 선택 모달
    // ==========================================
    function TrainingSetupModal({ isOpen, onClose, onStart }) {
      const [trainingType, setTrainingType] = useState('recall');
      const [direction, setDirection] = useState('en_to_ko');
      const [format, setFormat] = useState('one_by_one');
      const [timerSec, setTimerSec] = useState(10);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div className="w-full max-w-sm bg-white dark:bg-[#1D2A1F] rounded-3xl p-6 shadow-2xl space-y-4 animate-scaleUp">
            <div className="flex justify-between items-center pb-2 border-b border-stone-100 dark:border-stone-800">
              <div className="flex items-center gap-2">
                <span className="text-xl">🎯</span>
                <h3 className="font-black text-base text-[#2D5A27] dark:text-[#A1C954]">
                  훈련 단어장 모드 설정
                </h3>
              </div>
              <button onClick={onClose} className="w-7 h-7 rounded-full bg-stone-100 dark:bg-stone-800 font-bold text-xs text-stone-500">✕</button>
            </div>

            <div className="space-y-3.5 text-xs">
              
              <div className="space-y-1.5">
                <label className="font-bold text-stone-700 dark:text-stone-300">1. 훈련 방식 선택</label>
                <div className="grid grid-cols-3 gap-1.5">
                  {[
                    { id: 'recall', label: '🧠 워드리콜', sub: '4지선다' },
                    { id: 'flashcard', label: '🗂️ 플래시카드', sub: '뒤집기' },
                    { id: 'spelling', label: '✍️ 스펠링', sub: '타이핑' }
                  ].map(m => (
                    <button
                      key={m.id}
                      type="button"
                      onClick={() => setTrainingType(m.id)}
                      className={`p-2.5 rounded-2xl border text-center transition-all ${
                        trainingType === m.id
                          ? 'border-[#2D5A27] bg-[#FAF6EC] dark:bg-[#203624] text-[#2D5A27] dark:text-[#A1C954] font-black shadow-sm scale-105'
                          : 'border-stone-200 dark:border-stone-800 text-stone-500'
                      }`}
                    >
                      <div className="text-xs">{m.label}</div>
                      <div className="text-[9px] text-stone-400 mt-0.5">{m.sub}</div>
                    </button>
                  ))}
                </div>
              </div>

              <div className="space-y-1.5">
                <label className="font-bold text-stone-700 dark:text-stone-300">2. 출제 방향</label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setDirection('en_to_ko')}
                    className={`py-2 rounded-xl font-bold transition-all ${
                      direction === 'en_to_ko' ? 'bg-[#2D5A27] text-white shadow-sm' : 'bg-stone-100 dark:bg-stone-800 text-stone-500'
                    }`}
                  >
                    🇺🇸 영 ➔ 🇰🇷 한
                  </button>
                  <button
                    type="button"
                    onClick={() => setDirection('ko_to_en')}
                    className={`py-2 rounded-xl font-bold transition-all ${
                      direction === 'ko_to_en' ? 'bg-[#2D5A27] text-white shadow-sm' : 'bg-stone-100 dark:bg-stone-800 text-stone-500'
                    }`}
                  >
                    🇰🇷 한 ➔ 🇺🇸 영
                  </button>
                </div>
              </div>

              <div className="space-y-1.5">
                <label className="font-bold text-stone-700 dark:text-stone-300">3. 풀이 방식</label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setFormat('one_by_one')}
                    className={`py-2 rounded-xl font-bold transition-all ${
                      format === 'one_by_one' ? 'bg-[#5F8D4E] text-white shadow-sm' : 'bg-stone-100 dark:bg-stone-800 text-stone-500'
                    }`}
                  >
                    단어 하나씩 풀기
                  </button>
                  <button
                    type="button"
                    onClick={() => setFormat('list')}
                    className={`py-2 rounded-xl font-bold transition-all ${
                      format === 'list' ? 'bg-[#5F8D4E] text-white shadow-sm' : 'bg-stone-100 dark:bg-stone-800 text-stone-500'
                    }`}
                  >
                    리스트로 한 번에
                  </button>
                </div>
              </div>

              <div className="space-y-1.5">
                <label className="font-bold text-stone-700 dark:text-stone-300">4. 문제당 타이머</label>
                <div className="grid grid-cols-3 gap-1.5">
                  {[
                    { sec: 5, label: '⚡ 5초' },
                    { sec: 10, label: '⏱️ 10초' },
                    { sec: 0, label: '♾️ 무제한' }
                  ].map(t => (
                    <button
                      key={t.sec}
                      type="button"
                      onClick={() => setTimerSec(t.sec)}
                      className={`py-2 rounded-xl font-bold text-[11px] transition-all ${
                        timerSec === t.sec ? 'bg-[#A1C954] text-[#121B13] font-black shadow-sm' : 'bg-stone-100 dark:bg-stone-800 text-stone-500'
                      }`}
                    >
                      {t.label}
                    </button>
                  ))}
                </div>
              </div>

            </div>

            <button
              onClick={() => {
                onClose();
                onStart({ trainingType, direction, format, timerSec });
              }}
              className="w-full py-4 bg-[#5F8D4E] hover:bg-[#4d743f] text-white font-extrabold text-sm rounded-2xl shadow-lg active:scale-95 transition-all"
            >
              🚀 맞춤 훈련 시작하기
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 9. 커리큘럼 생성 (CreateCurriculumScreen)
    // ==========================================
    function CreateCurriculumScreen({ onTabChange, onCreateCurriculum }) {
      const [title, setTitle] = useState('');
      const [bookId, setBookId] = useState('voca_3000');
      const [dailyGoal, setDailyGoal] = useState(20);
      const [studyDays, setStudyDays] = useState(['월', '화', '수', '목', '금']);
      const [criteria, setCriteria] = useState(['vocab_study', 'recall']);

      const toggleCriteria = (critId) => {
        setCriteria(prev => 
          prev.includes(critId) ? prev.filter(c => c !== critId) : [...prev, critId]
        );
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (criteria.length === 0) {
          return alert("출석 인정 기준을 최소 1개 이상 선택해주세요.");
        }
        const selectedBook = BOOKS_DATA.find(b => b.id === bookId) || BOOKS_DATA[0];
        const newCurr = {
          id: 'curr_' + Date.now(),
          title: title.trim() || selectedBook.title + " 맞춤 과정",
          bookId,
          bookTitle: selectedBook.title,
          dailyGoal: Number(dailyGoal),
          studyDays,
          attendanceCriteria: criteria,
          createdAt: new Date().toISOString()
        };
        onCreateCurriculum(newCurr);
      };

      return (
        <div className="p-5 pb-8 space-y-6 animate-fadeIn">
          <div className="flex items-center justify-between">
            <button
              onClick={() => onTabChange('home')}
              className="w-10 h-10 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200 font-black text-base shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center"
            >
              ←
            </button>
            <h2 className="text-base font-black text-[#2D5A27] dark:text-[#A1C954]">
              ➕ 새 커리큘럼 생성
            </h2>
            <div className="w-10" />
          </div>

          <form onSubmit={handleSubmit} className="space-y-5 text-xs">
            
            <div className="space-y-1.5">
              <label className="font-bold text-stone-700 dark:text-stone-300">커리큘럼 이름</label>
              <input
                type="text"
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder="예: 30일 완성 필수 어휘 프로젝트"
                className="w-full p-3.5 rounded-2xl border border-stone-200 dark:border-stone-700 bg-white dark:bg-[#1D2A1F] font-bold focus:outline-none focus:ring-2 focus:ring-[#2D5A27]"
              />
            </div>

            <div className="space-y-1.5">
              <label className="font-bold text-stone-700 dark:text-stone-300">학습할 단어장 교재</label>
              <div className="space-y-2">
                {BOOKS_DATA.map(book => (
                  <div
                    key={book.id}
                    onClick={() => setBookId(book.id)}
                    className={`p-3.5 rounded-2xl border-2 cursor-pointer transition-all flex items-center justify-between ${
                      bookId === book.id
                        ? 'border-[#2D5A27] bg-[#FAF6EC] dark:bg-[#203624] dark:border-[#A1C954] shadow-sm'
                        : 'border-stone-200 dark:border-stone-800 bg-white dark:bg-[#1D2A1F]'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <span className="text-2xl">{book.icon}</span>
                      <div>
                        <div className="font-extrabold text-xs text-[#2C3E2D] dark:text-[#EDECE4]">{book.title}</div>
                        <div className="text-[10px] text-stone-400">{book.subtitle} ({book.count}단어)</div>
                      </div>
                    </div>
                    <span className={`text-xs ${bookId === book.id ? 'text-[#2D5A27] dark:text-[#A1C954] font-black' : 'text-stone-300'}`}>✓</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="space-y-1.5">
              <label className="font-bold text-stone-700 dark:text-stone-300">하루 목표 단어 수</label>
              <div className="grid grid-cols-4 gap-2">
                {[10, 20, 30, 50].map(cnt => (
                  <button
                    key={cnt}
                    type="button"
                    onClick={() => setDailyGoal(cnt)}
                    className={`py-3 rounded-2xl font-bold transition-all ${
                      dailyGoal === cnt
                        ? 'bg-[#2D5A27] text-white shadow-md font-black'
                        : 'bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-600 dark:text-stone-300'
                    }`}
                  >
                    {cnt}개
                  </button>
                ))}
              </div>
            </div>

            <div className="space-y-2">
              <div>
                <label className="font-bold text-stone-700 dark:text-stone-300">출석 인정 기준 (다중 선택)</label>
                <p className="text-[10px] text-stone-400">선택된 항목을 모두 완료해야 일일 출석 도장이 찍힙니다</p>
              </div>

              <div className="space-y-2">
                {[
                  { id: 'vocab_study', icon: '📖', title: '학습 단어장 완료', desc: '오늘 배정된 단어 카드를 모두 확인' },
                  { id: 'flashcard', icon: '🃏', title: '플래시카드 완료', desc: '단어를 가볍게 뒤집으며 암기 점검' },
                  { id: 'recall', icon: '🧠', title: '워드 리콜 훈련 완료', desc: '4지선다 인출 퀴즈를 모두 통과' },
                  { id: 'spelling', icon: '✍️', title: '스펠링 훈련 완료', desc: '철자를 키보드로 직접 타이핑' }
                ].map(crit => {
                  const checked = criteria.includes(crit.id);
                  return (
                    <div
                      key={crit.id}
                      onClick={() => toggleCriteria(crit.id)}
                      className={`p-3 rounded-2xl border-2 cursor-pointer transition-all flex items-center justify-between ${
                        checked
                          ? 'border-[#5F8D4E] bg-[#E8F5E9] dark:bg-[#1f3723] dark:border-[#A1C954]'
                          : 'border-stone-200 dark:border-stone-800 bg-white dark:bg-[#1D2A1F]'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <span className="text-xl">{crit.icon}</span>
                        <div>
                          <div className="font-bold text-xs">{crit.title}</div>
                          <div className="text-[10px] text-stone-400">{crit.desc}</div>
                        </div>
                      </div>
                      <div className={`w-6 h-6 rounded-lg flex items-center justify-center font-black ${
                        checked ? 'bg-[#2D5A27] text-white' : 'border border-stone-300 text-transparent'
                      }`}>
                        ✓
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <button
              type="submit"
              className="w-full py-4 bg-[#2D5A27] hover:bg-[#22471f] text-white font-extrabold text-sm rounded-2xl shadow-xl active:scale-95 transition-all mt-4"
            >
              🚀 커리큘럼 생성하고 학습 시작하기
            </button>

          </form>
        </div>
      );
    }

    // ==========================================
    // 10. 나의 커리큘럼 목록 (MyCurriculumsScreen)
    // ==========================================
    function MyCurriculumsScreen({ curriculums, activeCurriculumId, onSelect, onDelete, onTabChange }) {
      return (
        <div className="p-5 pb-8 space-y-6 animate-fadeIn">
          <div className="flex items-center justify-between">
            <button
              onClick={() => onTabChange('home')}
              className="w-10 h-10 rounded-2xl bg-white dark:bg-[#1D2A1F] border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-200 font-black text-base shadow-sm hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center"
            >
              ←
            </button>
            <h2 className="text-base font-black text-[#2D5A27] dark:text-[#A1C954]">
              📋 나의 커리큘럼 목록 ({curriculums.length})
            </h2>
            <button
              onClick={() => onTabChange('create_curr')}
              className="px-3 py-1.5 rounded-xl bg-[#2D5A27] text-white font-bold text-xs shadow-sm"

              + 추가
